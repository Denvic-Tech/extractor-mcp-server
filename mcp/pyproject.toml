[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor-build-manager"
version = "3.3.9"
description = "Python MCP bridge for the published Extractor 1C HTTP API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "mcp>=1.29,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
extractor1c-mcp = "extractor1c.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["extractor1c*"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".pytest-tmp", ".venv"]

[tool.ruff.lint]
# Ошибки и вероятные дефекты; оформление и сортировка импортов не навязываются.
select = ["E4", "E7", "E9", "F", "B"]
# B008: Field(...) в значении по умолчанию — способ FastMCP объявить обязательный аргумент.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Тесты используют компактные однострочные подделки и замыкания внутри циклов.
"tests/*" = ["E701", "E702", "B023"]
