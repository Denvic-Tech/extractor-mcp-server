[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor-build-manager"
version = "3.2.0"
description = "MCP bridge and 1C extension for managing Extractor 1C projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "mcp>=1.29,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "PyYAML>=6.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
extractor1c-mcp = "extractor1c.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["extractor1c*"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
